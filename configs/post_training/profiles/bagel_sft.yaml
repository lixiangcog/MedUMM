schema_version: "1.0"
runtime: {seed: 42, device: cuda, dtype: bfloat16}
post_training:
  method: bagel_sft
  execution: plan
  source:
    repository: https://github.com/ByteDance-Seed/Bagel
    revision: a2fa77dd8caeefc41e6607ae0ec17408d3f4ee9f
    license: Apache-2.0
    code_root: ${BAGEL_SOURCE_ROOT}
    strict_git_revision: true
  data: &medical_data
    contract_manifest: ${MEDUMM_POST_TRAIN_MANIFEST}
    provenance: ${MEDUMM_POST_TRAIN_PROVENANCE}
    license: ${MEDUMM_POST_TRAIN_DATA_LICENSE}
    deidentified: false
  stages:
    - name: joint_sft
      data: *medical_data
      launcher:
        entrypoint: torchrun
        cwd: ${BAGEL_SOURCE_ROOT}
        script: train/pretrain_unified_navit.py
        flag_style: underscore
        bool_style: value
        torchrun: {nnodes: 1, node_rank: 0, nproc_per_node: 4, master_port: 29501}
        args:
          dataset_config_file: ${BAGEL_MEDICAL_DATASET_CONFIG}
          model_path: ${BAGEL_MODEL_PATH}
          resume_from: ${BAGEL_MODEL_PATH}
          results_dir: ${MEDUMM_POST_TRAIN_OUTPUT}/bagel_sft
          max_latent_size: 64
          finetune_from_hf: true
          resume_model_only: true
          finetune_from_ema: true
          lr: 0.00002
      artifacts: {checkpoint_path: "${MEDUMM_POST_TRAIN_OUTPUT}/bagel_sft/checkpoints"}
  output_directory: ${MEDUMM_POST_TRAIN_OUTPUT}/bagel_sft
