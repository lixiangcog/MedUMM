schema_version: "1.0"
runtime: {seed: 42, device: cuda, dtype: bfloat16}
post_training:
  method: reca
  execution: plan
  source:
    repository: https://github.com/HorizonWind2004/reconstruction-alignment
    revision: 6b81efe25c55b24425ee9423240c3026e47c984a
    license: Apache-2.0
    code_root: ${RECA_SOURCE_ROOT}
    strict_git_revision: true
  data: &medical_data
    contract_manifest: ${MEDUMM_POST_TRAIN_MANIFEST}
    provenance: ${MEDUMM_POST_TRAIN_PROVENANCE}
    license: ${MEDUMM_POST_TRAIN_DATA_LICENSE}
    deidentified: false
  stages:
    - name: reconstruction_alignment
      data: *medical_data
      launcher:
        entrypoint: torchrun
        cwd: ${RECA_SOURCE_ROOT}/BAGEL
        script: train/pretrain_unified_navit.py
        flag_style: underscore
        bool_style: value
        torchrun: {nnodes: 1, node_rank: 0, nproc_per_node: 4, master_port: 29511}
        args:
          dataset_config_file: ${RECA_MEDICAL_DATASET_CONFIG}
          model_path: ${BAGEL_MODEL_PATH}
          resume_from: ${BAGEL_MODEL_PATH}
          checkpoint_dir: ${MEDUMM_POST_TRAIN_OUTPUT}/reca/checkpoints
          max_latent_size: 64
          freeze_vae: true
          freeze_vit: true
          freeze_und: true
          finetune_from_ema: true
          lr: 0.00004
      artifacts: {checkpoint_path: "${MEDUMM_POST_TRAIN_OUTPUT}/reca/checkpoints"}
  output_directory: ${MEDUMM_POST_TRAIN_OUTPUT}/reca
