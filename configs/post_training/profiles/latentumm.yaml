schema_version: "1.0"
runtime: {seed: 42, device: cuda, dtype: bfloat16}
post_training:
  method: latentumm
  execution: plan
  source:
    repository: https://github.com/AIFrontierLab/TorchUMM
    revision: 083395e0ae633d44ec237b2cdff98f2a7de89e5b
    license: VERIFY_AT_PINNED_REVISION
    code_root: ${LATENTUMM_SOURCE_ROOT}
    strict_git_revision: true
  data: &medical_data
    contract_manifest: ${MEDUMM_POST_TRAIN_MANIFEST}
    provenance: ${MEDUMM_POST_TRAIN_PROVENANCE}
    license: ${MEDUMM_POST_TRAIN_DATA_LICENSE}
    deidentified: false
  stages:
    - name: dual_latent_alignment
      data: *medical_data
      launcher:
        entrypoint: python
        cwd: ${LATENTUMM_SOURCE_ROOT}/src/umm/post_training/LatentUMM
        module: train.stage1_shared_latent
        flag_style: hyphen
        bool_style: flag
        args:
          prompts_path: ${LATENTUMM_MEDICAL_PROMPTS}
          image_root: ${LATENTUMM_MEDICAL_IMAGE_ROOT}
          embedding_root: ${LATENTUMM_MEDICAL_EMBEDDINGS}
          output_dir: ${MEDUMM_POST_TRAIN_OUTPUT}/latentumm/stage1
          cache_embeddings: true
      artifacts: {checkpoint_path: "${MEDUMM_POST_TRAIN_OUTPUT}/latentumm/stage1/stage1_shared_latent_model.pt"}
    - name: latent_dynamics
      data: *medical_data
      inputs: {dual_latent_alignment_checkpoint: "{{stages.dual_latent_alignment.checkpoint}}"}
      launcher:
        entrypoint: torchrun
        cwd: ${LATENTUMM_SOURCE_ROOT}/src/umm/post_training/LatentUMM
        module: train.pretrain_unified_navit_pt
        flag_style: underscore
        bool_style: value
        torchrun: {nnodes: 1, node_rank: 0, nproc_per_node: 4, master_port: 29551}
        args:
          dataset_config_file: ${LATENTUMM_MEDICAL_DATASET_CONFIG}
          model_path: ${BAGEL_MODEL_PATH}
          resume_from: ${BAGEL_MODEL_PATH}
          checkpoint_dir: ${MEDUMM_POST_TRAIN_OUTPUT}/latentumm/stage2
          shared_latent_teacher_ckpt: "{{stages.dual_latent_alignment.checkpoint}}"
          latentumm_embedding_root: ${LATENTUMM_MEDICAL_EMBEDDINGS}
          latentumm_enable: true
          latentumm_modal_weight: 0.01
          latentumm_task_weight: 0.01
          latentumm_pref_weight: 0.001
          latentumm_target_weight: 0.01
          latentumm_num_rollouts: 2
          latentumm_noise_std: 0.05
      artifacts: {checkpoint_path: "${MEDUMM_POST_TRAIN_OUTPUT}/latentumm/stage2"}
  output_directory: ${MEDUMM_POST_TRAIN_OUTPUT}/latentumm
