schema_version: "1.0"
runtime: {seed: 42, device: cpu}
evaluation:
  benchmark: medical_grounding
  data:
    adapter: medical_tasks_jsonl
    source: jsonl
    path: examples/medical/benchmarks_v1.6.jsonl
    image_root: examples/medical/images
    provenance: examples/medical/benchmarks_v1.6.provenance.json
    benchmark_filter: medical_grounding
    validate_media: true
    deidentified: true
  model:
    backbone: medical_reference
    parameters: {fixed_answer: '{"boxes":[[0.375,0.375,0.625,0.625]],"points":[[0.5,0.5]]}'}
  protocol:
    name: medical_grounding
    version: "1.0"
    metric_suite: medical_grounding
    require_provenance: true
    require_deidentified: true
  mode: full
  resume: false
  output_directory: outputs/evaluation/benchmarks_v1.6/medical_grounding
