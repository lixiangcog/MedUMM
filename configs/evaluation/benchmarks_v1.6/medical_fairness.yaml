schema_version: "1.0"
runtime: {seed: 42, device: cpu}
evaluation:
  benchmark: medical_fairness
  data:
    adapter: medical_tasks_jsonl
    source: jsonl
    path: examples/medical/benchmarks_v1.6.jsonl
    image_root: examples/medical/images
    provenance: examples/medical/benchmarks_v1.6.provenance.json
    benchmark_filter: medical_fairness
    validate_media: true
    deidentified: true
  model:
    backbone: medical_reference
    parameters: {fixed_answer: A}
  protocol:
    name: medical_fairness
    version: "1.0"
    metric_suite: medical_fairness
    require_provenance: true
    require_deidentified: true
    minimum_samples: 4
  mode: full
  batch_size: 4
  resume: false
  output_directory: outputs/evaluation/benchmarks_v1.6/medical_fairness
