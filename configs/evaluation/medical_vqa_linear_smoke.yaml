schema_version: "1.0"
evaluation:
  benchmark: medical_vqa
  data:
    adapter: medical_vqa_jsonl
    source: jsonl
    path: examples/medical/tiny_eval.jsonl
    image_root: examples/medical/images
    validate_images: true
  model:
    backbone: medical_linear
    config:
      model_path: outputs/post_training/medical_sft
  output_directory: outputs/evaluation/medical_vqa_linear
  resume: false
  mode: full
  batch_size: 2
