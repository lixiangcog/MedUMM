schema_version: "1.0"
runtime:
  seed: 42
  device: cuda
  dtype: float16
evaluation:
  benchmark: medical_tasks
  data:
    adapter: medical_tasks_jsonl
    source: jsonl
    path: data/vqa_rad_tasks_v0.6/samples.jsonl
    image_root: data/vqa_rad_tasks_v0.6/images
    provenance: data/vqa_rad_tasks_v0.6/provenance.json
    validate_images: true
    deidentified: true
  model:
    backbone: llava_med
    config:
      model_path: ${LLAVA_MED_MODEL_PATH}
      source_path: ${LLAVA_MED_SOURCE_PATH}
      revision: 91bb16c122001ddc9cf1fd36ce1dae09448943a2
      device: cuda
      device_map: auto
      conversation_mode: mistral_instruct
      use_keyword_stopping: false
      parameters:
        max_new_tokens: 64
        do_sample: false
    parameters:
      max_new_tokens: 64
      do_sample: false
  output_directory: outputs/evaluation/vqa_rad_medical_tasks_v0.6
  protocol:
    name: vqa_rad_medical_tasks
    version: "1.0"
    metric_suite: medical_task_core
    group_by: [medical_task, task_family, specialty, modality]
    bootstrap_samples: 2000
    confidence_level: 0.95
    seed: 42
    require_provenance: true
    require_reference_provenance: true
    require_deidentified: true
    minimum_samples: 24
    minimum_samples_per_task: 4
    required_tasks:
      - finding_assessment
      - clinical_description
      - anatomy_localization
      - quantitative_assessment
      - image_context
      - diagnostic_reasoning
  checkpoint:
    flush_every: 1
  mode: full
  batch_size: 1
  resume: true
