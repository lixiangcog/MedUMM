schema_version: "1.0"
runtime:
  seed: 42
  device: cuda
  dtype: float16
evaluation:
  benchmark: medical_vqa
  data:
    adapter: vqa_rad
    source: jsonl
    path: ${MEDUMM_VQA_MANIFEST}
    image_root: ${MEDUMM_VQA_IMAGE_ROOT}
    provenance: ${MEDUMM_VQA_PROVENANCE}
    source_revision: osf:5b213a9886d8510012c26c09:v1
    validate_images: true
    deidentified: true
  model:
    backbone: llava_med_v1_5_7b
    config:
      model_path: ${LLAVA_MED_MODEL_PATH}
      source_path: ${LLAVA_MED_SOURCE_PATH}
      revision: 91bb16c122001ddc9cf1fd36ce1dae09448943a2
      device: cuda
      device_map: auto
      conversation_mode: mistral_instruct
      parameters:
        max_new_tokens: 32
        do_sample: false
    parameters:
      max_new_tokens: 32
      do_sample: false
  output_directory: outputs/evaluation/vqa_rad_catalog_v0.8
  prompt_template: "{question}\nAnswer yes or no only."
  protocol:
    name: vqa_rad_catalog_acceptance
    version: "1.0"
    metric_suite: medical_vqa_core
    group_by: [modality, category, answer_type, language]
    bootstrap_samples: 1000
    confidence_level: 0.95
    seed: 42
    require_provenance: true
    require_deidentified: true
    minimum_samples: 4
  checkpoint:
    flush_every: 1
  mode: full
  batch_size: 1
  resume: false
