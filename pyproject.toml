[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medumm"
version = "0.1.0"
description = "Unified medical multimodal model toolkit"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
baseline = ["numpy>=1.24", "pillow>=9.0"]
medical = [
  "accelerate>=1.0",
  "numpy>=1.24",
  "pillow>=9.0",
  "torch>=2.2",
  "transformers>=4.50",
]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8.0", "numpy>=1.24", "pillow>=9.0"]

[project.scripts]
medumm = "medumm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
