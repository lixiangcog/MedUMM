name: model environments

on:
  push:
    paths:
      - "src/medumm/environments/**"
      - "environments/**"
      - "modal/**"
      - "scripts/*model_env*"
      - "scripts/generate_model_environments.py"
      - "tests/test_model_environments.py"
      - ".github/workflows/model-environments.yml"
  pull_request:
    paths:
      - "src/medumm/environments/**"
      - "environments/**"
      - "modal/**"
      - "scripts/*model_env*"
      - "scripts/generate_model_environments.py"
      - "tests/test_model_environments.py"
      - ".github/workflows/model-environments.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install "uv==0.8.11"
      - run: python scripts/generate_model_environments.py --check
      - run: python scripts/resolve_model_environments.py
      - run: python -m pytest tests/test_model_environments.py
      - run: |
          for script in scripts/setup_model_env.sh scripts/build_model_container.sh scripts/slurm_model_environment.sh; do
            bash -n "$script"
          done
